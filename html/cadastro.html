<h1>ONG - Salvando Vidas</h1>
                
            </div>
            <button class="menu-hamburguer"
                     type="button"
                    aria-label="Abrir menu"
                    aria-expanded="false">
                    ☰
            </button>

            <nav id="menu-principal">

            </nav>
            
        </header> 
        <section>
            <h2> Cadastre-se </h2>
            <a class="alerta" role="status">
                <strong>Atenção:</strong>
                Preencha todos os campos seguindo os formatos indicados.
            </a>

            <form id="form-cadastro">
                <fieldset>
                        <legend>Informações Pessoais</legend>
        
                        <label for="nome">Nome Completo:</label>
                        <input 
                                type="text" 
                                id="nome" 
                                name="nome" 
                                required
                        >
                        <label for="cpf">CPF:</label>
                        <input type="text" 
                                id="cpf" 
                                name="cpf"
                                pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" 
                                placeholder="000.000.000-00" 
                                title="Formato: 000.000.000-00"
                                required
                        >
        
                        <label for="email">E-mail:</label>
                        <input type="email" 
                                id="email" 
                                name="email" 
                                required
                        >
        
                        <label for="nascimento">Data de Nascimento:</label>
                        <input type="date" 
                                id="nascimento" 
                                name="nascimento"
                                required
                        >
                        
                        <label for="cep">CEP:</label>
                        <input type="text" 
                                id="cep"
                                name="cep"
                                pattern="[0-9]{5}-[0-9]{3}"
                                placeholder="00000-000" 
                                title="Formato: 00000-000"
                                required
                        >

                        <label for="telefone">Telefone:</label>
                        <input 
                                type="tel"
                                id="telefone"
                                name="telefone"
                                pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}"
                                placeholder="(00) 00000-0000"
                                title="Formato: (00) 00000-0000"
                                required
                        >
        
                </fieldset>
                <button class="botao-enviar" type="submit">
                     Enviar formulário 
                </button>

                </form>
                <a id="toast" role="status" aria-live="polite"></a>
            <div id="toast" role="status" aria-live="polite"></div>
        </section>
    </main>
    <script type="module" src="../JS/main.js"></script>
</body>
</html>
